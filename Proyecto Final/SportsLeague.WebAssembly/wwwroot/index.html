<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports League MS - Sistema de Gestión de Ligas</title>
    <base href="/" />
    
    <!-- Fuentes modernas de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS y Bootstrap Icons -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    
    <!-- Hoja de Estilos de la Aplicación -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="images/logo-Sports-League-MS.png" />
    <link href="SportsLeague.WebAssembly.styles.css" rel="stylesheet" />
</head>

<body class="bg-sports-dark text-sports-white">
    <div id="app">
        <div class="initial-loader">
            <div class="loader-logo-wrapper">
                <img src="images/logo-Sports-League-MS.png" alt="Cargando..." class="loader-logo" />
            </div>
            <div class="loader-spinner"></div>
            <p class="loader-text">Iniciando Sports League Management System...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        <div class="d-flex align-items-center justify-content-between p-3">
            <span>Ha ocurrido un error inesperado en la aplicación.</span>
            <div>
                <a href="" class="btn btn-sm btn-yellow me-2">Recargar</a>
                <a class="dismiss btn btn-sm btn-outline-light">✕</a>
            </div>
        </div>
    </div>
    
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
